[project]
name = "ticketbot"
version = "0.1.0"
description = "Config-driven ticket -> PR agent runtime"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
solari = ["solari-browser>=0.1.2", "solari-sandbox>=0.2.0", "solari-desktop>=0.2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ticketbot = "ticketbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticketbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
